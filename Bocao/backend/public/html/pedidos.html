<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Pedido - Bocão</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <nav class="menu">

        <a href="index.html"><button>🏠 Início</button></a>
        <a href="produtos.html"><button>📦 Produtos</button></a>
        <a href="cozinha.html"><button>👨‍🍳 Cozinha</button></a>
        <a href="retirada.html"><button>🛎 Retirada</button></a>
        <a href="caixa.html"><button>💳 Caixa</button></a>
        <a href="relatorios.html"><button>📊 Relatórios</button></a>

    </nav>

    <div class="container fade">

        <h1>📝 Novo Pedido</h1>

        <h2>Informações do Pedido</h2>

        <div class="form">

            <label>Produto</label>

            <select id="produto">

            </select>

            <label>Quantidade</label>

            <input
                id="quantidade"
                type="number"
                value="1"
                min="1">

            <label>Observações</label>

            <textarea
                id="observacao"
                placeholder="Ex: sem cebola, molho à parte..."></textarea>

            <label>Forma de Pagamento</label>

            <select id="pagamento">

                <option value="Dinheiro">💵 Dinheiro</option>

                <option value="Cartão">💳 Cartão</option>

                <option value="Pix">📱 Pix</option>

            </select>

            <label>Setor Responsável</label>

            <select id="setor">

                <option value="Cozinha">👨‍🍳 Cozinha</option>

                <option value="Retirada">🛎 Retirada</option>

            </select>

            <button onclick="adicionarItem()">

                ➕ Adicionar Produto

            </button>

        </div>

        <hr>

        <h2>🛒 Itens do Pedido</h2>

        <div id="listaItens">

        </div>

        <h3 id="totalPedido">

            Total: R$ 0,00

        </h3>

        <button onclick="criarPedido()">

            ✅ Finalizar Pedido

        </button>

        <p id="mensagem"></p>

    </div>

    <script src="../js/pedidos.js"></script>

</body>

</html>
