<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Bocão</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>


<div class="login-container">

    <h1>Bocão</h1>

    <h2>Sistema de Gestão de Pedidos</h2>


    <input 
    type="email" 
    id="email"
    placeholder="E-mail">


    <input 
    type="password"
    id="senha"
    placeholder="Senha">


    <button onclick="login()">
        Entrar
    </button>


    <p id="mensagem"></p>


</div>


<script src="../js/login.js"></script>

</body>

</html>
