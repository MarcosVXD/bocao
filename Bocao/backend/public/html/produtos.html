<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos - Bocão</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <nav class="menu">

        <a href="index.html"><button>🏠 Início</button></a>
        <a href="pedidos.html"><button>📝 Pedidos</button></a>
        <a href="cozinha.html"><button>👨‍🍳 Cozinha</button></a>
        <a href="retirada.html"><button>🛎 Retirada</button></a>
        <a href="caixa.html"><button>💳 Caixa</button></a>
        <a href="relatorios.html"><button>📊 Relatórios</button></a>

    </nav>

    <div class="container fade">

        <h1>📦 Cadastro de Produtos</h1>

        <h2>Adicionar novo produto</h2>

        <div class="form">

            <label>Nome do Produto</label>

            <input
                id="nome"
                placeholder="Ex: X-Bacon">

            <label>Descrição</label>

            <input
                id="descricao"
                placeholder="Descrição do produto">

            <label>Categoria</label>

            <input
                id="categoria"
                placeholder="Ex: Lanches">

            <label>Preço</label>

            <input
                id="preco"
                type="number"
                step="0.01"
                placeholder="0,00">

            <button onclick="cadastrarProduto()">
                ➕ Cadastrar Produto
            </button>

        </div>

        <hr>

        <h2>Produtos Cadastrados</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Ação</th>

                </tr>

            </thead>

            <tbody id="listaProdutos">

            </tbody>

        </table>

    </div>

    <script src="../js/produtos.js"></script>

</body>

</html>
